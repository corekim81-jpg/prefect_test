services:
  prefect-server:
    image: prefecthq/prefect:3.9.0-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect

  examples:
    build: .
    depends_on:
      - prefect-server
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    command: python -m prefect_examples.observability
    restart: "no"

volumes:
  prefect-data:
