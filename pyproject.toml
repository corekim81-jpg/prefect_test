[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prefect-feature-examples"
version = "0.1.0"
description = "실행 가능한 Prefect 3 기능별 예제 모음"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "prefect>=3.9.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]
distributed = [
  "prefect-dask>=0.3,<1",
  "distributed>=2025.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prefect_examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
